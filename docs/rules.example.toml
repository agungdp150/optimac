# User overlay: load explicitly with --config. All rules start disabled.
# Configured scans are read-only; proposed operations do not grant execution.
# Provider metadata is compiled, not user-overridable: policy/source/version matrix,
# verification date, executable trust, activity checks, regeneration and reconciliation.
# Exact-version mutation certification is empty until adapters are tested.
# New rules default to inventory; operations are proposals, not execution grants.
# schema_version must be 2. Unknown fields/IDs, duplicates and unsafe values fail.
# operation: inventory | recovery | permanent | guidance
# age_basis: mtime_hint | not_applicable (requires explicit min_age_days = 0)
# size_basis: aggregate_review_unit; on_denied: report_partial
# risk: conditional_cache | review | protected; class mapping: see adapter contract.
# Basename matcher: case-sensitive whole component; only * and ? wildcards.
# Dot is literal; reject slash, **, brackets, braces and escapes; no shell expansion.
# Bytes are decimal. Log thresholds apply to the aggregate directory/rotation group.
# file_removal_default is the direct-file action default, never a plan override.
# high_risk requires named-object plus irreversible-consequence confirmation.
# auto_expire_days must be 0; purge_requires_confirmation must be true in v2.
# Example scope: with global project_roots = ["~/Projects"], a rule may use
# scan_roots = ["~/Projects/demo"]. ["~/Documents"] must be rejected as outside scope.
schema_version = 2

[defaults]
enabled = false
auto_select = false
operation = "inventory"
file_removal_default = "recovery"
require_confirmation = true
allow_sudo = false
follow_symlinks = false
skip_cloud_and_network = true
unknown_activity = "block"
min_age_days = 30
age_basis = "mtime_hint"
min_size_bytes = 10000000
size_basis = "aggregate_review_unit"

[scope]
project_roots = []
file_roots = []
exclude_paths = []

[access]
preflight = true
on_denied = "report_partial"
show_permission_guidance = true

[recovery]
warn_threshold_bytes = 10000000000
purge_requires_confirmation = true
auto_expire_days = 0

[scan]
quick_max_entries_per_provider = 10000
quick_max_seconds_per_provider = 2
quick_max_seconds_global = 30
deep_max_entries_per_provider = 250000
deep_max_entries_global = 1000000
deep_max_seconds_global = 120
duplicate_max_read_bytes = 10000000000
duplicate_max_seconds_global = 60

[ui]
inventory_page_size = 50
show_all_inventory_default = true

