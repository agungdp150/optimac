[package]
name = "optimac"
version = "0.2.0"
edition = "2024"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Compile both library and CLI without production recovery authority for fixture tests.
[features]
fixture-only = []

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ctrlc = "3.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2.191"
toml = "0.8"
sha2 = "0.10.9"
